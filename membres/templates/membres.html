<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nom</th>
                <th>Postnom</th>
                <th>Prénom</th>
                <th>Fonction</th>
            </tr>
        </thead>
        <tbody>
            {% for m in membres %}
            <tr>
                <td>{{ m.nom }}</td>
                <td>{{ m.postnom }}</td>
                <td>{{ m.prenom }}</td>
                <td>{{ m.fonction }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">
                    Aucun membre enregistré
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
