{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width:500px;">

        <h2 class="text-center mb-4">
            Nouveau mot de passe
        </h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success w-100">
                Modifier mot de passe
            </button>
        </form>

    </div>
</div>

{% endblock %}
